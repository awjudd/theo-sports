<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Henry &amp; Theo Sports</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<button id="mute" class="icon-btn" title="Sound on/off (M)" aria-label="Toggle sound">🔊</button>

<main>
  <section id="screen-title" class="screen active">
    <h1>Henry &amp; Theo<br><span>SPORTS</span></h1>
    <canvas id="title-canvas" width="560" height="320"></canvas>
    <button class="btn big" id="btn-play">Let's Play!</button>
    <p class="hint">Dress up · spin the wheel · hockey, baseball, soccer, disc golf &amp; lacrosse</p>
  </section>

  <section id="screen-locker" class="screen">
    <h2>Locker Room</h2>
    <div class="locker">
      <div class="preview">
        <div class="tabs">
          <button class="tab active" data-who="henry">Henry</button>
          <button class="tab" data-who="theo">Theo</button>
        </div>
        <canvas id="preview" width="320" height="400"></canvas>
        <div class="row">
          <button id="btn-random" class="btn small">🎲 Random</button>
          <button id="btn-reset" class="btn small">↺ Reset</button>
        </div>
      </div>
      <div class="options" id="options"></div>
    </div>
    <div class="bottom">
      <div class="modes" id="modes"></div>
      <button class="btn big" id="btn-spin">🎡 Spin the Wheel!</button>
    </div>
  </section>

  <section id="screen-wheel" class="screen">
    <h2>Spin for a sport!</h2>
    <canvas id="wheel" width="560" height="610"></canvas>
    <div class="row">
      <button id="btn-dospin" class="btn big">SPIN! <small>(Space)</small></button>
      <button id="btn-back-locker" class="btn small">← Locker Room</button>
    </div>
    <p id="wheel-result" class="wheel-result">&nbsp;</p>
  </section>

  <section id="screen-game" class="screen">
    <div id="game-wrap">
      <canvas id="game" width="960" height="600"></canvas>
      <button id="btn-menu" class="icon-btn menu" title="Pause (Esc)" aria-label="Pause">☰</button>
      <div id="overlay" class="overlay hidden"><div class="card" id="overlay-card"></div></div>
    </div>
  </section>
</main>

<script src="js/sfx.js"></script>
<script src="js/input.js"></script>
<script src="js/characters.js"></script>
<script src="js/wheel.js"></script>
<script src="js/sports/arena.js"></script>
<script src="js/sports/baseball.js"></script>
<script src="js/sports/discgolf.js"></script>
<script src="js/main.js"></script>
</body>
</html>
