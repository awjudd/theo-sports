<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Henry &amp; Theo Sports</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<button id="fs" class="icon-btn" title="Full screen" aria-label="Toggle full screen">⛶</button>
<button id="mute" class="icon-btn" title="Sound on/off (M)" aria-label="Toggle sound">🔊</button>

<main>
  <section id="screen-title" class="screen active">
    <h1>Henry &amp; Theo<br><span>SPORTS</span></h1>
    <canvas id="title-canvas" width="560" height="320"></canvas>
    <button class="btn big" id="btn-play">Let's Play!</button>
    <p class="hint">Dress up · spin the wheel · twenty-six games to play</p>
  </section>

  <section id="screen-select" class="screen">
    <h2>Choose your characters</h2>
    <div class="slots">
      <button class="slot s0 active" id="slot0"><span class="slot-title">PLAYER 1</span><canvas id="slot0-cv" width="190" height="210"></canvas><span class="slot-name" id="slot0-name"></span></button>
      <div class="vs">VS</div>
      <button class="slot s1" id="slot1"><span class="slot-title">PLAYER 2</span><canvas id="slot1-cv" width="190" height="210"></canvas><span class="slot-name" id="slot1-name"></span></button>
    </div>
    <p class="hint" id="sel-hint">Pick a character for Player 1</p>
    <div class="char-grid" id="char-grid"></div>
    <div class="modes" id="modes2"></div>
    <div class="row">
      <button class="btn" id="btn-sel-dress">👕 Dress them up</button>
      <button class="btn" id="btn-sel-spin">🎡 Spin the Wheel</button>
      <button class="btn alt" id="btn-sel-pick">🎮 Choose a Game</button>
    </div>
  </section>

  <section id="screen-locker" class="screen">
    <h2>Locker Room</h2>
    <div class="locker">
      <div class="preview">
        <div class="tabs" id="tabs"></div>
        <canvas id="preview" width="320" height="400"></canvas>
        <div class="row">
          <button id="btn-random" class="btn small">🎲 Random</button>
          <button id="btn-reset" class="btn small">↺ Reset</button>
        </div>
      </div>
      <div class="options" id="options"></div>
    </div>
    <div class="bottom">
      <div class="modes" id="modes"></div>
      <div class="row"><button class="btn big alt" id="btn-chars">👥 Characters</button><button class="btn big" id="btn-spin">🎡 Spin the Wheel!</button><button class="btn big alt" id="btn-pick">🎮 Choose a Game</button></div>
    </div>
  </section>

  <section id="screen-pick" class="screen">
    <h2>Choose a game</h2>
    <div class="sport-grid" id="sport-grid"></div>
    <div class="row"><button id="btn-pick-back" class="btn small">← Locker Room</button></div>
  </section>

  <section id="screen-wheel" class="screen">
    <h2>Spin for a sport!</h2>
    <canvas id="wheel" width="560" height="610"></canvas>
    <div class="row">
      <button id="btn-dospin" class="btn big">SPIN! <small>(Space)</small></button>
      <button id="btn-back-locker" class="btn small">← Locker Room</button>
    </div>
    <p id="wheel-result" class="wheel-result">&nbsp;</p>
  </section>

  <section id="screen-game" class="screen">
    <div id="game-wrap">
      <canvas id="game" width="960" height="600"></canvas>
      <button id="btn-menu" class="icon-btn menu" title="Pause (Esc)" aria-label="Pause">☰</button>
      <div id="overlay" class="overlay hidden"><div class="card" id="overlay-card"></div></div>
    </div>
  </section>
</main>

<script src="js/sfx.js"></script>
<script src="js/input.js"></script>
<script src="js/characters.js"></script>
<script src="js/wheel.js"></script>
<script src="js/sports/common.js"></script>
<script src="js/sports/arena.js"></script>
<script src="js/sports/baseball.js"></script>
<script src="js/sports/discgolf.js"></script>
<script src="js/sports/basketball.js"></script>
<script src="js/sports/bowling.js"></script>
<script src="js/sports/football.js"></script>
<script src="js/sports/archery.js"></script>
<script src="js/sports/hurdles.js"></script>
<script src="js/sports/penalty.js"></script>
<script src="js/sports/sumo.js"></script>
<script src="js/sports/swimming.js"></script>
<script src="js/sports/tugofwar.js"></script>
<script src="js/sports/dodgeball.js"></script>
<script src="js/sports/minigolf.js"></script>
<script src="js/sports/volleyball.js"></script>
<script src="js/sports/whackamole.js"></script>
<script src="js/sports/quickdraw.js"></script>
<script src="js/sports/simon.js"></script>
<script src="js/sports/cornhole.js"></script>
<script src="js/sports/darts.js"></script>
<script src="js/sports/skiing.js"></script>
<script src="js/sports/racing.js"></script>
<script src="js/sports/boxing.js"></script>
<script src="js/main.js"></script>
</body>
</html>
